<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WrapPrep – parts removal guides</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;700&display=swap">
<style>
:root{--bg:#e9ebec;--card:#fff;--line:#d9dde0;--ink:#14181c;--mute:#5d676f;--tape:#f2c230;--tapeink:#14181c;--bad:#c0392b;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#101214;--card:#1a1d20;--line:#2b3036;--ink:#eef1f3;--mute:#98a2ab}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:620px;margin:0 auto}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px}
header h1 span{background:var(--tape);color:var(--tapeink);padding:0 6px;margin-right:2px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:500}
button.pri{background:var(--tape);color:var(--tapeink);border-color:var(--tape);font-weight:700}
button.pri:disabled{opacity:.5}
button.lnk{border:0;background:none;color:var(--mute);padding:4px 8px;border-radius:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.box{background:var(--card);border-bottom:1px solid var(--line);padding:14px}
.box input,.box textarea,dialog input{width:100%;border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 10px;margin-bottom:8px}
.box textarea{min-height:90px;resize:vertical;font-size:17px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.mute{color:var(--mute);font-size:14px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.thumbs div{position:relative}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}
.thumbs b{position:absolute;top:2px;right:2px;background:#000c;color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;line-height:22px;cursor:pointer;font-size:14px}
.post{background:var(--card);border-bottom:1px solid var(--line);padding:14px;display:flex;gap:10px}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--tape);color:var(--tapeink);font-weight:700;display:grid;place-items:center;font-size:18px}
.main{min-width:0;flex:1}
.meta{font-size:15px}.meta b{font-weight:700}
.veh{display:inline-block;background:var(--bg);border-radius:6px;padding:0 8px;font-size:14px;margin:2px 0}
.body{margin:4px 0;overflow-wrap:anywhere}
.body img.inl,.imgs img{max-width:100%;border-radius:12px;display:block;margin:8px 0}
.imgs{display:grid;gap:4px;grid-template-columns:repeat(auto-fit,minmax(45%,1fr));margin:8px 0}
.imgs img{width:100%;height:100%;max-height:340px;object-fit:cover;margin:0}
.acts{display:flex;gap:2px;margin-left:-8px;flex-wrap:wrap}
.replies{margin-top:8px;border-left:3px solid var(--tape);padding-left:10px}
.replies .post{padding:8px 0;border:0;background:none}
.replies .av{width:30px;height:30px;font-size:14px}
.empty,.msg{padding:28px 14px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:min(92vw,360px);padding:18px}
dialog::backdrop{background:#0008}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.err{color:var(--bad);font-size:14px;margin:0 0 8px}
input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
<header><h1><span>Wrap</span>Prep</h1><div id="who" class="row"></div></header>
<div id="compose"></div>
<main id="feed"><div class="msg">Loading…</div></main>
</div>

<dialog id="auth">
  <h2 style="margin-top:0">Join WrapPrep</h2>
  <input id="aUser" placeholder="Username (new accounts)" autocomplete="username">
  <input id="aMail" type="email" placeholder="Email" autocomplete="email">
  <input id="aPass" type="password" placeholder="Password (6+ characters)" autocomplete="current-password">
  <p class="err" id="aErr"></p>
  <div class="row"><button class="pri" id="aIn">Sign in</button><button id="aUp">Create account</button><span class="sp"></span><button class="lnk" id="aX">Close</button></div>
</dialog>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ---- 1. Fill these in (see setup.sql and the steps in the chat) ----
const CFG = {
  SUPABASE_URL: 'https://lfqjoptasnumpintrtvz.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmcWpvcHRhc251bXBpbnRydHZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM5MzA2MDMsImV4cCI6MjEwOTUwNjYwM30.7olUbx4m1aKnTpcsqbGIcOoKcd_yxlN4dibL7sDFfno',
  CLOUD_NAME: 'kw0ybcte',
  UPLOAD_PRESET: 'WrapDatabase'   // must be an UNSIGNED preset
};
// ---------------------------------------------------------------------

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank = () => ({vehicle:'', body:'', images:[]});
let sb, user = null, admin = false, draft = loadDraft(), t1, busy = false;

function loadDraft(){ try { return Object.assign(blank(), JSON.parse(localStorage.getItem('wp-draft'))) } catch(e){ return blank() } }
function saveDraft(){ try { localStorage.setItem('wp-draft', JSON.stringify(draft)); toast('Draft saved') } catch(e){} }
function autosave(){ clearTimeout(t1); t1 = setTimeout(saveDraft, 600) }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),1600) }

// Links never render as links: image URLs become images, every other URL is dropped.
function fmt(text){
  return esc(text)
    .replace(/https?:\/\/[^\s<]+/g, u => /\.(jpe?g|png|gif|webp|avif)(\?|$)|res\.cloudinary\.com/i.test(u) ? `<img class="inl" src="${u}" loading="lazy" alt="">` : '')
    .replace(/\n/g, '<br>');
}
const opt = u => u.replace('/upload/', '/upload/f_auto,q_auto,w_1200/');
function ago(d){ const s=(Date.now()-new Date(d))/1000; if(s<60)return 'now'; if(s<3600)return Math.floor(s/60)+'m'; if(s<86400)return Math.floor(s/3600)+'h'; return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric'}) }

// ---- Camera / upload ----
async function shrink(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', .82));
}
async function upload(file){
  const fd = new FormData();
  fd.append('file', await shrink(file));
  fd.append('upload_preset', CFG.UPLOAD_PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CFG.CLOUD_NAME}/image/upload`, {method:'POST', body:fd});
  if(!r.ok) throw new Error('Cloudinary upload failed');
  return (await r.json()).secure_url;
}
async function addFiles(files){
  if(!files.length) return;
  busy = true; render(); toast('Uploading…');
  try { for(const f of files){ draft.images.push(await upload(f)); saveDraft() } }
  catch(e){ toast(e.message) }
  busy = false; render();
}

// ---- Rendering ----
function render(){
  $('#who').innerHTML = user
    ? `<span class="mute">${esc(user.user_metadata?.username || user.email)}${admin?' (admin)':''}</span><button id="out">Sign out</button>`
    : `<button class="pri" id="inBtn">Sign in</button>`;
  const c = $('#compose');
  if(!user){ c.innerHTML = `<div class="box mute">Sign in to post a guide or reply.</div>`; return }
  c.innerHTML = `<div class="box">
    <input id="dVeh" placeholder="Vehicle, e.g. 2019 Honda Civic – front bumper" value="${esc(draft.vehicle)}">
    <textarea id="dBody" placeholder="How do you remove it? Tools, clip locations, gotchas…">${esc(draft.body)}</textarea>
    <div class="thumbs">${draft.images.map((u,i)=>`<div><img src="${esc(opt(u))}" alt=""><b data-rm="${i}">×</b></div>`).join('')}</div>
    <div class="row">
      <label class="lnk"><button type="button" onclick="$('#cam').click()">Camera</button></label>
      <button type="button" onclick="$('#gal').click()">Photos</button>
      <span class="sp mute" id="st">${busy?'Uploading…':''}</span>
      <button class="pri" id="post" ${busy?'disabled':''}>Post</button>
    </div>
    <input type="file" id="cam" accept="image/*" capture="environment">
    <input type="file" id="gal" accept="image/*" multiple>
  </div>`;
}
function card(p, top){
  const mine = user && user.id === p.user_id, can = mine || admin, reps = p.replies || [];
  return `<article class="post" data-id="${p.id}">
    <div class="av">${esc((p.author||'?')[0].toUpperCase())}</div>
    <div class="main">
      <div class="meta"><b>${esc(p.author)}</b> <span class="mute">${ago(p.created_at)}${p.updated_at?' · edited':''}</span></div>
      ${p.vehicle?`<div class="veh">${esc(p.vehicle)}</div>`:''}
      <div class="body">${fmt(p.body)}</div>
      ${p.images?.length?`<div class="imgs">${p.images.map(u=>`<img src="${esc(opt(u))}" loading="lazy" alt="">`).join('')}</div>`:''}
      <div class="acts">
        ${top?`<button class="lnk" data-a="rep">Replies (${reps.length})</button>`:''}
        ${can?`<button class="lnk" data-a="edit">Edit</button><button class="lnk" data-a="del">Delete</button>`:''}
      </div>
      ${top?`<div class="replies" hidden>${reps.map(r=>card(r,false)).join('')}${user?`<div class="row"><input placeholder="Write a reply" data-ri style="flex:1;border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 9px"><button class="pri" data-a="send">Reply</button></div>`:''}</div>`:''}
    </div></article>`;
}
async function loadFeed(){
  const f = $('#feed');
  const {data:tops, error} = await sb.from('posts').select('*').is('parent_id', null).order('created_at', {ascending:false}).limit(50);
  if(error){ f.innerHTML = `<div class="msg">Couldn’t load posts: ${esc(error.message)}</div>`; return }
  if(!tops.length){ f.innerHTML = `<div class="empty">No guides yet. Post the first removal guide.</div>`; return }
  const {data:reps} = await sb.from('posts').select('*').in('parent_id', tops.map(p=>p.id)).order('created_at');
  tops.forEach(p => p.replies = (reps||[]).filter(r => r.parent_id === p.id));
  f.innerHTML = tops.map(p => card(p, true)).join('');
}

// ---- Events ----
document.addEventListener('input', e => {
  if(e.target.id==='dBody'){ draft.body = e.target.value; autosave() }
  if(e.target.id==='dVeh'){ draft.vehicle = e.target.value; autosave() }
});
document.addEventListener('change', e => {
  if(e.target.id==='cam' || e.target.id==='gal'){ addFiles([...e.target.files]); e.target.value='' }
});
document.addEventListener('click', async e => {
  const t = e.target;
  if(t.id==='inBtn') $('#auth').showModal();
  if(t.id==='out'){ await sb.auth.signOut() }
  if(t.dataset.rm){ draft.images.splice(+t.dataset.rm,1); saveDraft(); render() }
  if(t.id==='post'){
    if(!draft.body.trim() && !draft.images.length) return toast('Add some text or a photo');
    const {error} = await sb.from('posts').insert({author: user.user_metadata?.username || user.email.split('@')[0], vehicle: draft.vehicle.trim()||null, body: draft.body.trim(), images: draft.images});
    if(error) return toast(error.message);
    draft = blank(); saveDraft(); render(); loadFeed(); toast('Posted');
  }
  const a = t.dataset.a; if(!a) return;
  const el = t.closest('.post'), id = el.dataset.id;
  if(a==='rep'){ const r = el.querySelector('.replies'); r.hidden = !r.hidden }
  if(a==='send'){
    const inp = el.querySelector('[data-ri]'); if(!inp.value.trim()) return;
    const {error} = await sb.from('posts').insert({author: user.user_metadata?.username || user.email.split('@')[0], parent_id:id, body:inp.value.trim()});
    if(error) return toast(error.message);
    await loadFeed(); document.querySelector(`[data-id="${id}"] .replies`).hidden = false;
  }
  if(a==='del' && confirm('Delete this post?')){ const {error} = await sb.from('posts').delete().eq('id', id); if(error) toast(error.message); else loadFeed() }
  if(a==='edit') startEdit(el, id);
});
async function startEdit(el, id){
  const {data:p} = await sb.from('posts').select('*').eq('id', id).single();
  const m = el.querySelector('.main'); const keep = [...(p.images||[])];
  const paint = () => m.innerHTML = `
    <textarea id="eBody" style="width:100%;min-height:90px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px;font-size:16px">${esc(p.body)}</textarea>
    <div class="thumbs">${keep.map((u,i)=>`<div><img src="${esc(opt(u))}" alt=""><b data-x="${i}">×</b></div>`).join('')}</div>
    <div class="row"><button class="pri" id="eSave">Save changes</button><button id="eCancel">Cancel</button></div>`;
  paint();
  const key = 'wp-edit-' + id, saved = localStorage.getItem(key); if(saved) m.querySelector('#eBody').value = saved;
  m.addEventListener('input', ev => { if(ev.target.id==='eBody'){ try{localStorage.setItem(key, ev.target.value)}catch(x){} } });
  m.addEventListener('click', async ev => {
    if(ev.target.dataset.x){ p.body = m.querySelector('#eBody').value; keep.splice(+ev.target.dataset.x,1); paint() }
    if(ev.target.id==='eCancel'){ localStorage.removeItem(key); loadFeed() }
    if(ev.target.id==='eSave'){
      const {error} = await sb.from('posts').update({body: m.querySelector('#eBody').value.trim(), images: keep, updated_at: new Date().toISOString()}).eq('id', id);
      if(error) return toast(error.message);
      localStorage.removeItem(key); loadFeed(); toast('Saved');
    }
  });
}

// ---- Auth ----
$('#aX').onclick = () => $('#auth').close();
$('#aIn').onclick = async () => {
  const {error} = await sb.auth.signInWithPassword({email:$('#aMail').value, password:$('#aPass').value});
  error ? $('#aErr').textContent = error.message : $('#auth').close();
};
$('#aUp').onclick = async () => {
  const username = $('#aUser').value.trim(); if(!username){ $('#aErr').textContent = 'Pick a username first.'; return }
  const {error} = await sb.auth.signUp({email:$('#aMail').value, password:$('#aPass').value, options:{data:{username}}});
  error ? $('#aErr').textContent = error.message : ($('#aErr').textContent = 'Check your email to confirm, then sign in.');
};
async function setUser(u){
  user = u; admin = false;
  if(u){ const {data} = await sb.from('admins').select('user_id').eq('user_id', u.id); admin = !!(data && data.length) }
  render(); loadFeed();
}

// ---- Start ----
if(!CFG.SUPABASE_URL){ $('#feed').innerHTML = `<div class="msg">Add your Supabase and Cloudinary keys at the top of index.html to begin.</div>` }
else {
  sb = supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((_e, s) => setUser(s?.user ?? null));
  render();
}
</script>
</body>
</html>
